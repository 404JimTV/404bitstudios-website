<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitBot Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h2>BitBot</h2>

        <nav>
            <a href="#">🏠 Dashboard</a>
            <a href="#">🖥 Servers</a>
            <a href="#">🎵 Music</a>
            <a href="#">👥 Community</a>
            <a href="#">📊 Analytics</a>
            <a href="#">🛡 Moderation</a>
            <a href="#">⚙ Settings</a>
        </nav>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Dashboard</h1>
                <p>Welcome back, Jim</p>
            </div>

            <div class="user-box">
                404Jimtv
            </div>

        </header>

        <!-- QUICK STATS -->

        <section class="stats-grid">

            <div class="stat-card">
                <h3>Servers</h3>
                <p>1</p>
            </div>

            <div class="stat-card">
                <h3>Users</h3>
                <p>0</p>
            </div>

            <div class="stat-card">
                <h3>Commands Today</h3>
                <p>0</p>
            </div>

            <div class="stat-card">
                <h3>Music Sessions</h3>
                <p>0</p>
            </div>

        </section>

        <!-- STATUS -->

        <section class="panel">

            <h2>Bot Status</h2>

            <div class="status-grid">

                <div class="status online">
                    ✅ Online
                </div>

                <div class="status online">
                    ✅ Database Connected
                </div>

                <div class="status online">
                    ✅ Discord Connected
                </div>

                <div class="status online">
                    ✅ API Connected
                </div>

            </div>

        </section>

        <!-- QUICK ACTIONS -->

        <section class="panel">

            <h2>Quick Actions</h2>

            <div class="action-grid">

                <button>Manage Servers</button>
                <button>Music Controls</button>
                <button>Community Settings</button>
                <button>View Analytics</button>

            </div>

        </section>

    </main>

</body>

</html>
